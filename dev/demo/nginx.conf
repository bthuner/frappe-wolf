# Minimal Frappe front: logs every request with the site name so the agent can count 5xx per site.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  log_format wolf '$frappe_site $remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  upstream backend { server backend:8000; }
  server {
    listen 8080;
    set $frappe_site wolf.localhost;
    access_log /var/log/wolf-nginx/access.log wolf;
    client_max_body_size 20m;
    location /assets { alias /home/frappe/frappe-bench/sites/assets; try_files $uri =404; }
    location /socket.io {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Frappe-Site-Name $frappe_site;
      proxy_pass http://websocket:9000;
    }
    location / {
      proxy_set_header Host $frappe_site;
      proxy_set_header X-Frappe-Site-Name $frappe_site;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 120;
      proxy_pass http://backend;
    }
  }
}
