# Minimal Frappe front: logs every request with the site name so the agent can count 5xx per site.
user frappe root;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  log_format wolf '$frappe_site $remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  # Docker's DNS, asked at each request: a stopped backend no longer resolves, so nginx answers
  # 502 at once, as for a bench whose gunicorn is down. A cached address would leave requests
  # hanging on an unreachable host instead, and nginx could not start while the backend is down.
  resolver 127.0.0.11 valid=2s ipv6=off;
  server {
    listen 8080;
    set $frappe_site wolf.localhost;
    access_log /var/log/wolf-nginx/access.log wolf;
    client_max_body_size 20m;
    location /assets/ { alias /home/frappe/frappe-bench/sites/assets/; }
    location /socket.io {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Frappe-Site-Name $frappe_site;
      # Frappe's socket.io server accepts a connection only if Origin and Host name the same
      # host, then calls the site back at Origin to check the session and each room's read
      # permission. Inside this stack the site answers at frontend:8080 (this nginx), not at
      # the browser's localhost:8099. (Frappe's own nginx template rewrites Origin too.)
      proxy_set_header Host frontend:8080;
      proxy_set_header Origin http://frontend:8080;
      proxy_pass http://websocket:9000;
    }
    location / {
      proxy_set_header Host $frappe_site;
      proxy_set_header X-Frappe-Site-Name $frappe_site;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 120;
      set $backend http://backend:8000;
      proxy_pass $backend;
    }
  }
}
