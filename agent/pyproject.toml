[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wolf-agent"
version = "0.1.0"
description = "Host-side agent for Frappe Wolf observability"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
toml = ["tomli>=1.1; python_version < '3.11'"]

[project.scripts]
wolf-agent = "wolf_agent.cli:main"

[tool.setuptools.packages.find]
include = ["wolf_agent*"]
