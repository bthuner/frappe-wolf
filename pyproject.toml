[project]
name = "frappe_wolf"
authors = [{ name = "Théo Hunerblaes", email = "theohunerblaes@me.com" }]
description = "First-class observability for Frappe benches, ERPNext/Dokos sites and Linux hosts"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Pinned rule set so a new ruff release cannot change what CI checks. Frappe code is
# tab-indented, so pycodestyle whitespace rules (W, E1, E2) stay off.
select = ["E4", "E7", "E9", "F", "B"]
